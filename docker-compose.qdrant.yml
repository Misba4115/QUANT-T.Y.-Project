name: quant-local
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: quant-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - quant_qdrant_data:/qdrant/storage
volumes:
  quant_qdrant_data:
    external: true
